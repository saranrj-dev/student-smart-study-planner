name: Build Android Study Planner APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-native-alarm/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android-native-alarm
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: student-study-planner-android-apk
          path: android-native-alarm/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
