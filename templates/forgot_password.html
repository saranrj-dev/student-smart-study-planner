<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="form-box">

    <h1>🔐 Reset Password</h1>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Enter Username"
            required
        >

        <input
            type="password"
            name="new_password"
            placeholder="Enter New Password"
            required
        >

        <button type="submit">
            Reset Password
        </button>

    </form>

    <br>

    <a href="/login">← Back to Login</a>

</div>

</body>
</html>
